app = "lutt-moov"
primary_region = "fra"

kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]

[env]
  PHX_HOST = "lutt-moov.fly.dev"
  PORT = "8080"
  DATABASE_PATH = "/data/luttmoov.db"

[mounts]
  source = "luttmoov_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
