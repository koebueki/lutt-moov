app = "lutt-moov"
primary_region = "fra"

kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]

[env]
  PHX_HOST = "luttmoov.kristoffn.net"
  DATABASE_PATH = "/data/luttmoov.db"

  # Requests go Fly proxy -> Anubis (:8080) -> Phoenix (127.0.0.1:4000)
  PHX_IP = "127.0.0.1"
  PORT = "4000"

  # Anubis, see https://anubis.techaro.lol/docs/admin/installation
  BIND = ":8080"
  TARGET = "http://127.0.0.1:4000"
  POLICY_FNAME = "/app/anubis/botPolicies.yaml"
  CUSTOM_REAL_IP_HEADER = "Fly-Client-IP"
  REDIRECT_DOMAINS = "luttmoov.kristoffn.net"

[mounts]
  source = "luttmoov_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    # Goes through Anubis to Phoenix. Anubis always lets /robots.txt through,
    # whereas "/" may get a challenge page (with status 200) instead.
    path = "/robots.txt"
    timeout = "5s"

  [http_service.checks.headers]
    Fly-Client-IP = "127.0.0.1"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
